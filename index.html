<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      // A continuous S-shaped path and light traveling toward the sun.
      AFRAME.registerComponent('landscape-flow', {
        init: function () {
          const T = AFRAME.THREE;
          const v = (x, y) => new T.Vector3(x, y, 0);
          this.curve = new T.CurvePath();
          this.curve.add(new T.CubicBezierCurve3(v(0.02,-0.94), v(0.08,-0.70), v(0.70,-0.52), v(0.37,-0.27)));
          this.curve.add(new T.CubicBezierCurve3(v(0.37,-0.27), v(0.05,-0.03), v(-0.54,0.10), v(-0.08,0.33)));
          this.curve.add(new T.CubicBezierCurve3(v(-0.08,0.33), v(0.25,0.48), v(0.92,0.43), v(0.88,0.88)));
          const geometry = new T.TubeGeometry(this.curve, 100, 0.065, 8, false);
          const material = new T.MeshBasicMaterial({color: 0x191919});
          this.el.setObject3D('path', new T.Mesh(geometry, material));
          this.dots = Array.from({length: 4}, (_, i) => {
            const dot = new T.Mesh(new T.SphereGeometry(0.039 - i * 0.004, 12, 8),
              new T.MeshBasicMaterial({color: [0xffda6a,0xffc447,0xffe59a,0xfff2bf][i], transparent: true}));
            this.el.object3D.add(dot);
            return dot;
          });
        },
        tick: function (time) {
          this.dots.forEach((dot, i) => {
            const t = ((time / 3400 - i * 0.16) % 1 + 1) % 1;
            dot.position.copy(this.curve.getPointAt(t));
            dot.position.z += 0.066;
            dot.material.opacity = Math.min(1, t * 18, (1-t) * 18);
          });
        },
        remove: function () {
          const path = this.el.getObject3D('path');
          if (path) { path.geometry.dispose(); path.material.dispose(); this.el.removeObject3D('path'); }
          this.dots.forEach(dot => { this.el.object3D.remove(dot); dot.geometry.dispose(); dot.material.dispose(); });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- Your custom marker -->
      <a-marker type="pattern" url="assets/pattern-357 - Zine Icons-02.patt">
        <!-- Landscape: light travels along a winding path toward the sun. -->
        <a-entity rotation="-90 0 0" position="0 0.12 0" scale="0.55 0.55 0.55">
          <a-entity landscape-flow></a-entity>
          <a-circle position="0.88 0.88 0.075" radius="0.16"
                    material="color: #F6C84B; shader: flat; side: double"
                    animation__pulse="property: scale; from: 1 1 1; to: 1.12 1.12 1.12; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"></a-circle>
          <a-circle position="0.88 0.88 0.074" radius="0.23"
                    material="color: #F6C84B; shader: flat; opacity: 0.18; transparent: true; depthWrite: false; side: double"></a-circle>
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="assets/pattern-357 - Zine Icons-03.patt">
        
        <!-- Parent Entity: Handles the spinning spin (Y-axis) and the hopping motion -->
        <a-entity position="0 0.5 0"
                  animation__hop="property: position; from: 0 0.5 0; to: 0 1.2 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
                  animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          
          <!-- Child Entity: Tilts the text flat so it rotates horizontally like a rotor blade -->
          <a-entity rotation="-90 0 0">
            
            <!-- Main Text -->
            <a-text value="LILY IS AWESOME" 
                    align="center" 
                    color="#00FF88" 
                    scale="2 2 2"
                    side="double">
            </a-text>

            <!-- Shadow Text Layer for 3D depth -->
            <a-text value="LILY" 
                    align="center" 
                    color="#003311" 
                    position="0 0 -0.05"
                    scale="2 2 2"
                    side="double">
            </a-text>

          </a-entity>
          
        </a-entity>

      </a-marker>

      <a-marker type="pattern" url="assets/pattern-357 - Zine Icons-04.patt">
        
        <!-- Parent Entity: Handles the spinning spin (Y-axis) and the hopping motion -->
        <a-entity position="0 0.5 0"
                  animation__hop="property: position; from: 0 0.5 0; to: 0 1.2 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
                  animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          
          <!-- Child Entity: Tilts the text flat so it rotates horizontally like a rotor blade -->
          <a-entity rotation="-90 0 0">
            
            <!-- Main Text -->
            <a-text value="LILY IS AWESOME" 
                    align="center" 
                    color="#00FF88" 
                    scale="2 2 2"
                    side="double">
            </a-text>

            <!-- Shadow Text Layer for 3D depth -->
            <a-text value="LILY" 
                    align="center" 
                    color="#003311" 
                    position="0 0 -0.05"
                    scale="2 2 2"
                    side="double">
            </a-text>

          </a-entity>
          
        </a-entity>

      </a-marker>

      <a-marker type="pattern" url="assets/pattern-357 - Zine Icons-05.patt">
        
        <!-- Parent Entity: Handles the spinning spin (Y-axis) and the hopping motion -->
        <a-entity position="0 0.5 0"
                  animation__hop="property: position; from: 0 0.5 0; to: 0 1.2 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
                  animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          
          <!-- Child Entity: Tilts the text flat so it rotates horizontally like a rotor blade -->
          <a-entity rotation="-90 0 0">
            
            <!-- Main Text -->
            <a-text value="LILY IS AWESOME" 
                    align="center" 
                    color="#00FF88" 
                    scale="2 2 2"
                    side="double">
            </a-text>

            <!-- Shadow Text Layer for 3D depth -->
            <a-text value="LILY" 
                    align="center" 
                    color="#003311" 
                    position="0 0 -0.05"
                    scale="2 2 2"
                    side="double">
            </a-text>

          </a-entity>
          
        </a-entity>

      </a-marker>

      <a-marker type="pattern" url="assets/pattern-357 - Zine Icons-06.patt">
        <!-- Monarch: gentle hover; one complete wingbeat every 2.4 seconds. -->
        <a-entity position="0 0.65 0"
                  animation__hover="property: position; from: 0 0.65 0; to: 0 0.82 0; dir: alternate; loop: true; dur: 2400; easing: easeInOutSine">
          <a-entity rotation="-90 0 0" scale="0.85 0.85 0.85">
            <!-- Wings pivot at the body rather than at their centers. -->
            <a-entity rotation="0 -8 0"
                      animation__flap="property: rotation; from: 0 -8 0; to: 0 -65 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
              <a-plane position="0.75 0 0" width="1.5" height="1.5"
                       material="src: url(assets/monarch-wing-custom.svg); transparent: true; alphaTest: 0.05; side: double; shader: flat"></a-plane>
            </a-entity>
            <a-entity rotation="0 8 0"
                      animation__flap="property: rotation; from: 0 8 0; to: 0 65 0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
              <a-plane position="-0.75 0 0" scale="-1 1 1" width="1.5" height="1.5"
                       material="src: url(assets/monarch-wing-custom.svg); transparent: true; alphaTest: 0.05; side: double; shader: flat"></a-plane>
            </a-entity>
            <!-- Body and antennae. -->
            <a-sphere position="0 -0.12 0.025" scale="0.065 0.39 0.06" color="#191614"></a-sphere>
            <a-sphere position="0 0.28 0.035" radius="0.085" color="#191614"></a-sphere>
            <a-entity line="start: -0.03 0.32 0.04; end: -0.16 0.55 0.05; color: #191614"
                      line__right="start: 0.03 0.32 0.04; end: 0.16 0.55 0.05; color: #191614"></a-entity>
            <a-sphere position="-0.16 0.55 0.05" radius="0.022" color="#191614"></a-sphere>
            <a-sphere position="0.16 0.55 0.05" radius="0.022" color="#191614"></a-sphere>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
